<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIT College Bus Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFBEF;--card:#fff;--ink:#14213D;--mute:#5f6b85;--line:#eadfb8;--bus:#F2B705;--route:#1F8A5B;--done:#b9b39b;--busink:#14213D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--card:#18223a;--ink:#f4efe0;--mute:#9aa6c2;--line:#2b3757;--route:#4cc790;--done:#566182}}
:root[data-theme="dark"]{--bg:#0F1626;--card:#18223a;--ink:#f4efe0;--mute:#9aa6c2;--line:#2b3757;--route:#4cc790;--done:#566182}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind',system-ui,sans-serif;font-size:16px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:14px}
.live{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--route)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--route);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:var(--bus);color:var(--busink);border:0;padding:18px}
.hero .big{font-size:38px;font-weight:700;line-height:1.1}
.hero p{margin:6px 0 0;font-weight:500}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat b{display:block;font-size:20px}.stat span{font-size:13px;color:var(--mute)}
.bar{height:8px;border-radius:8px;background:rgba(20,33,61,.2);overflow:hidden;margin-top:12px}
.bar div{height:100%;background:var(--busink);width:0;transition:width .8s linear}
label{font-size:14px;color:var(--mute)}
select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
.mine{margin-top:10px;font-weight:600}
svg.map{width:100%;height:auto;display:block}
.stop{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.stop:last-child{border:0}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--route);background:var(--card);flex:none}
.stop.done .dot{background:var(--done);border-color:var(--done)}
.stop.next .dot{background:var(--bus);border-color:var(--busink)}
.nm{flex:1;font-weight:600}.stop.done .nm{color:var(--mute);font-weight:400}
.et{font-size:14px;color:var(--mute);text-align:right}.stop.next .et{color:var(--ink);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;padding:13px;border-radius:12px;font:inherit;font-weight:700;text-decoration:none;border:0;cursor:pointer;color:var(--busink);background:var(--bus)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.pick.on{border-color:var(--bus);background:var(--bus);color:var(--busink)}
.pick .av{width:46px;height:46px;border-radius:50%;background:var(--busink);color:var(--bus);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.pick small{display:block;opacity:.8}
.pick .st{margin-left:auto;font-size:12px;font-weight:700;text-align:right}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span{color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:14px 4px;font:inherit;font-size:14px;color:var(--mute);cursor:pointer}
nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px var(--bus)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--route);outline-offset:2px}
.tab{display:none}.tab.on{display:block}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>VIT Bus Tracker</h1><div class="sub" id="rt">–</div></div>
  <div class="live"><i></i><span id="lv">Demo</span></div>
</header>

<section class="tab on" id="t-track">
  <div class="card hero">
    <div class="sub" style="color:inherit;opacity:.8" id="heroLbl">Next stop</div>
    <div class="big" id="nextName">–</div>
    <p id="nextEta">–</p>
    <div class="bar"><div id="prog"></div></div>
  </div>
  <div class="row">
    <div class="card stat"><b id="vitEta">–</b><span>Reaches VIT in</span></div>
    <div class="card stat"><b id="lastSeen">–</b><span>Last passed</span></div>
  </div>
  <div class="card">
    <label for="mine">My stop</label>
    <select id="mine"></select>
    <div class="mine" id="mineOut"></div>
  </div>
  <div class="card">
    <svg class="map" viewBox="0 0 360 440" role="img" aria-label="Bus route map">
      <path id="path" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="pathDone" fill="none" stroke="var(--route)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="pins"></g>
      <g id="bus"><circle r="17" fill="var(--bus)" stroke="var(--busink)" stroke-width="3"/>
      <path d="M-8 -5h16v9h-16z M-8 0h16" fill="none" stroke="var(--busink)" stroke-width="2"/><circle cx="-4" cy="6" r="1.8" fill="var(--busink)"/><circle cx="4" cy="6" r="1.8" fill="var(--busink)"/></g>
    </svg>
  </div>
  <a class="btn alt" id="gmap" target="_blank" rel="noopener">Open route in Google Maps</a>
</section>

<section class="tab" id="t-route">
  <div class="card"><h2 style="margin:0 0 4px;font-size:18px" id="rTitle"></h2><div class="sub" id="rTotal"></div></div>
  <div class="card" id="stopList"></div>
</section>

<section class="tab" id="t-driver">
  <div class="sub" style="margin-bottom:8px">Select driver / route</div>
  <div id="drivers"></div>
  <div class="card">
    <div class="kv"><span>Driver</span><b id="dn"></b></div>
    <div class="kv"><span>Phone</span><b id="dp"></b></div>
    <div class="kv"><span>Route</span><b id="dr"></b></div>
  </div>
  <div class="row">
    <a class="btn" id="call">Call driver</a>
    <a class="btn alt" id="wa" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</section>
</div>

<nav>
  <button class="on" data-t="track">Track</button>
  <button data-t="route">Route</button>
  <button data-t="driver">Driver</button>
</nav>

<script>
// ===== EDIT HERE: drivers, phones, stops =====
// ["Stop name", minutes from previous stop]   (Route 2 & 3 minutes are assumed; change them)
const BUSES=[
 {label:'Route 1',driver:'Zahid Sir',phone:'8459579946',start:12,
  stops:[['Pardi',0],['Prajapati Square',10],['Wathoda',10],['Kharbi',10],['Dighori',10],['Bahadura',20],['VIT',30]]},
 {label:'Route 2',driver:'Zahur Sheikh',phone:'8767300216',start:35,
  stops:[['Kamal Square',0],['Dahi Bazar',10],['Azad Chowk',10],['Telephone Exchange',10],['Nandanvan',10],['Bhande Plot',10],['Dighori',10],['VIT',20]]},
 {label:'Route 3',driver:'Rakhunde Sir',phone:'9767645888',start:5,
  stops:[['Jivan Vikas Chowk',0],['Bhisi Naka',10],['Kawrapeth',10],['WCC',10],['Udasa',10],['UTI',10],['VIT',20]]}
];
// ===== LIVE MODE (optional) =====
// null = demo mode (double-click index.html). Paste Firebase config here to track real GPS. See LIVE_TRACKING_SETUP.md
const FIREBASE_CONFIG={apiKey:"AIzaSyBxtclGJHvD6qEMni9khu-8coXRwE2_dfo",authDomain:"vit-bus-tracking-application.firebaseapp.com",databaseURL:"https://vit-bus-tracking-application-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"vit-bus-tracking-application",appId:"1:935717548847:web:bb3da04751c6032871e7da"};
/* const FIREBASE_CONFIG={apiKey:"...",authDomain:"...",databaseURL:"https://....firebaseio.com",projectId:"...",appId:"..."}; */
// Real lat,lng of each stop (same order as stops above). These are PLACEHOLDERS - replace using Google Maps (long-press on stop).
const COORDS=[
 [[21.170,79.120],[21.149998,79.148590],[21.150,79.090],[21.140,79.070],[21.120,79.060],[21.100,79.040],[21.080,79.020]],
 [[21.160,79.110],[21.155,79.100],[21.150,79.095],[21.145,79.085],[21.135,79.075],[21.125,79.065],[21.115,79.055],[21.080,79.020]],
 [[21.180,79.080],[21.170,79.075],[21.160,79.070],[21.145,79.060],[21.125,79.050],[21.105,79.035],[21.080,79.020]]
];
// ================================
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const fmt=m=>m<=0?'Now':m<60?Math.ceil(m)+' min':Math.floor(m/60)+' hr '+Math.ceil(m%60)+' min';

BUSES.forEach((b,bi)=>{
  let c=0;b.total=0;
  b.stops=b.stops.map(s=>{c+=s[1];return{n:s[0],m:s[1],t:c}});
  b.total=c;b.t=b.start;
  const n=b.stops.length;
  b.stops.forEach((s,i)=>{s.lat=COORDS[bi][i][0];s.lng=COORDS[bi][i][1];s.x=180+110*Math.sin(i*1.7);s.y=40+i*(375/(n-1))});
});

let cur=0;
try{cur=+localStorage.getItem('bus')||0}catch(e){}
if(cur>=BUSES.length)cur=0;

function pos(b){
  let i=0;while(i<b.stops.length-2&&b.t>=b.stops[i+1].t)i++;
  const a=b.stops[i],c=b.stops[i+1],f=Math.min(1,Math.max(0,(b.t-a.t)/(c.t-a.t)));
  return{i,x:a.x+(c.x-a.x)*f,y:a.y+(c.y-a.y)*f};
}

function select(i){
  cur=i;const b=BUSES[i];
  try{localStorage.setItem('bus',i)}catch(e){}
  $('rt').textContent=b.label+': '+b.stops[0].n+' → VIT';
  $('path').setAttribute('d',b.stops.map((s,k)=>(k?'L':'M')+s.x.toFixed(1)+' '+s.y.toFixed(1)).join(' '));
  $('pins').innerHTML='';
  b.stops.forEach(s=>{
    const g=document.createElementNS(NS,'g'),ci=document.createElementNS(NS,'circle'),tx=document.createElementNS(NS,'text');
    ci.setAttribute('cx',s.x);ci.setAttribute('cy',s.y);ci.setAttribute('r',7);
    ci.setAttribute('fill','var(--card)');ci.setAttribute('stroke','var(--route)');ci.setAttribute('stroke-width',4);
    const left=s.x>200;
    tx.setAttribute('x',s.x+(left?-14:14));tx.setAttribute('y',s.y+5);tx.setAttribute('text-anchor',left?'end':'start');
    tx.setAttribute('font-size','13');tx.setAttribute('font-weight','600');tx.setAttribute('fill','var(--ink)');
    tx.textContent=s.n;g.append(ci,tx);$('pins').append(g);
  });
  $('mine').innerHTML='';b.stops.forEach((s,k)=>$('mine').add(new Option(s.n,k)));
  let my=b.stops.length-2;try{const v=localStorage.getItem('my'+i);if(v!==null)my=+v}catch(e){}
  $('mine').value=my;
  const q=s=>encodeURIComponent(s+', Nagpur');
  $('gmap').href='https://www.google.com/maps/dir/?api=1&origin='+q(b.stops[0].n)+'&destination='+q('VIT')+
    '&waypoints='+b.stops.slice(1,-1).map(s=>q(s.n)).join('|')+'&travelmode=driving';
  $('rTitle').textContent=b.label+' · '+b.stops[0].n+' → VIT';
  $('rTotal').textContent='Total time: '+fmt(b.total);
  $('dn').textContent=b.driver;$('dp').textContent=b.phone;$('dr').textContent=b.label;
  $('call').href='tel:'+b.phone;$('wa').href='https://wa.me/91'+b.phone;
  render();
}
$('mine').onchange=()=>{try{localStorage.setItem('my'+cur,$('mine').value)}catch(e){}render()};

function render(){
  const b=BUSES[cur],p=pos(b),arrived=b.t>=b.total,t=b.t;
  const nxt=arrived?b.stops.length-1:p.i+1;
  $('bus').setAttribute('transform','translate('+p.x+' '+p.y+')');
  $('pathDone').setAttribute('d',b.stops.slice(0,p.i+1).map((s,k)=>(k?'L':'M')+s.x.toFixed(1)+' '+s.y.toFixed(1)).join(' ')+' L'+p.x.toFixed(1)+' '+p.y.toFixed(1));
  $('prog').style.width=(t/b.total*100)+'%';
  $('heroLbl').textContent=arrived?'Bus has arrived':'Next stop';
  $('nextName').textContent=b.stops[nxt].n;
  $('nextEta').textContent=arrived?'Reached VIT campus':'Arriving in '+fmt(b.stops[nxt].t-t);
  $('vitEta').textContent=fmt(b.total-t);
  $('lastSeen').textContent=arrived?'VIT':b.stops[p.i].n;
  const my=+$('mine').value,left=b.stops[my].t-t;
  $('mineOut').textContent=left<=0?'Bus has passed '+b.stops[my].n:'Bus reaches '+b.stops[my].n+' in '+fmt(left);
  $('stopList').innerHTML=b.stops.map((s,i)=>{
    const cls=s.t<=t?'done':i===nxt?'next':'';
    return '<div class="stop '+cls+'"><span class="dot"></span><div class="nm">'+s.n+'<div class="sub">'+(i?s.m+' min from '+b.stops[i-1].n:'Starting point')+'</div></div><div class="et">'+(s.t<=t?'Passed':fmt(s.t-t))+'</div></div>';
  }).join('');
  $('drivers').innerHTML=BUSES.map((x,i)=>{
    const q=pos(x),ar=x.t>=x.total;
    return '<button class="pick'+(i===cur?' on':'')+'" data-i="'+i+'"><span class="av">'+x.driver[0]+'</span><span><b>'+x.label+' · '+x.driver+'</b><small>'+x.stops[0].n+' → VIT</small></span><span class="st">'+(ar?'At VIT':'Next: '+x.stops[q.i+1].n)+'</span></button>';
  }).join('');
  document.querySelectorAll('.pick').forEach(el=>el.onclick=()=>{select(+el.dataset.i);show('track')});
}

function show(n){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===n));
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+n));
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));

// Demo simulation: 1 real second = 1 bus minute, each bus moves on its own.
const LIVE=!!FIREBASE_CONFIG;let off=0;
function prog(b,lat,lng){ // project GPS point on route -> minutes along route
  const k=Math.cos(lat*Math.PI/180);let best=null;
  for(let i=0;i<b.stops.length-1;i++){
    const a=b.stops[i],c=b.stops[i+1],ax=a.lng*k,ay=a.lat,dx=c.lng*k-ax,dy=c.lat-ay,px=lng*k,py=lat;
    let f=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1);f=Math.max(0,Math.min(1,f));
    const d=Math.hypot(px-ax-f*dx,py-ay-f*dy);if(!best||d<best.d)best={d,t:a.t+f*(c.t-a.t)};
  }return best.t;
}
if(LIVE){
  BUSES.forEach(b=>b.t=0);
  const L=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.append(s)});
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  L(base+'firebase-app-compat.js').then(()=>L(base+'firebase-database-compat.js')).then(()=>{
    firebase.initializeApp(FIREBASE_CONFIG);const db=firebase.database();
    db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
    BUSES.forEach((b,i)=>db.ref('bus'+(i+1)).on('value',s=>b.live=s.val()));
  }).catch(()=>$('lv').textContent='Net error');
}
setInterval(()=>{
  BUSES.forEach(b=>{
    if(LIVE){const d=b.live;b.on=!!(d&&d.active&&Date.now()+off-d.time<60000);if(b.on)b.t=prog(b,d.lat,d.lng)}
    else{b.t+=1;if(b.t>b.total+4)b.t=0}
  });
  if(LIVE)$('lv').textContent=BUSES[cur].on?'Live':'Bus offline';
  render();
},1000);
select(cur);
</script>
</body>
</html>
